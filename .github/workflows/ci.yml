name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.14"]
    env:
      CHAOS_HOME: ${{ github.workspace }}/.tmp/chaos-home
      PROFILE: ${{ github.workspace }}/.tmp/chaos-home
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.24.11"
      - name: Install gitleaks (pinned to the version used locally)
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Install package
        run: python -m pip install -e ".[mcp]"
      - name: Safety check
        run: make safety-check
      - name: Vendor and owner name gate
        run: make vendor-check
      - name: Gitleaks full-history scan
        run: PATH="$HOME/go/bin:$PATH" make gitleaks-scan
      - name: Compile and tests
        run: make compile test
      - name: Build the wheel
        run: python -m pip install build==1.6.1 && python -m build
      - name: Wheel carries the seed, the skills, the schema, and NOTICE
        run: |
          python -c "import glob, zipfile; names = set(zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist()); need = ['chaos_trader/seed/roster.json', 'chaos_trader/skills/blockchain/solana/SKILL.md', 'chaos_trader/skills/blockchain/chaos-solana-intelligence/SKILL.md', 'chaos_trader/trading/schemas/smart_wallets_schema.sql']; missing = [n for n in need if n not in names]; assert not missing, missing; assert len([n for n in names if n.startswith('chaos_trader/skills/blockchain/') and n.endswith('/SKILL.md') and n.count('/') == 4]) == 14, 'expected 14 skills in wheel'; assert any('.dist-info/' in n and n.endswith('/NOTICE') for n in names), 'NOTICE missing from wheel'; print('wheel ok')"
      - name: Wheel ships no test modules; the sdist keeps them
        run: |
          python -c "import glob, tarfile, zipfile; wheel = zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist(); tests = [n for n in wheel if n.rsplit('/', 1)[-1].startswith('test_')]; assert not tests, tests; sdist = tarfile.open(glob.glob('dist/*.tar.gz')[0]).getnames(); assert any(n.endswith('/chaos_trader/trading/scripts/test_no_redirect.py') for n in sdist), 'the sdist lost the package tests'; assert any(n.endswith('/chaos_trader/trading/scripts/fixtures/xai_http_fake.py') for n in sdist), 'the sdist lost the test fixtures'; print('tests and fixtures in the sdist only')"
      # pip-audit cannot read a wheel file, so the wheel's own Requires-Dist lines become the requirements it audits.
      # An extra's marker is dropped, so the mcp extra is audited too; with the marker it would be skipped.
      - name: Audit the wheel's dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          python -c "import glob, zipfile; z = zipfile.ZipFile(glob.glob('dist/*.whl')[0]); meta = next(n for n in z.namelist() if n.endswith('.dist-info/METADATA')); reqs = [l.split(':', 1)[1].strip() for l in z.read(meta).decode().splitlines() if l.startswith('Requires-Dist:')]; reqs = [r.split(';', 1)[0].strip() if 'extra ==' in r else r for r in reqs]; open('$RUNNER_TEMP/wheel-requirements.txt', 'w').write(''.join(r + '\n' for r in reqs))"
          python -m pip_audit --strict --progress-spinner off -r "$RUNNER_TEMP/wheel-requirements.txt"
      - name: Full-history private-name scan
        run: python tools/history_name_scan.py
      - name: Clean-home onboard smoke
        run: |
          chaos onboard --home "$RUNNER_TEMP/h" --rpc-url https://api.mainnet-beta.solana.com --yes
          CHAOS_HOME="$RUNNER_TEMP/h" chaos help
