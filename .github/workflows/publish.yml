name: publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: The tag matches the package version
        run: |
          python -c "import pathlib, sys, tomllib; tag = sys.argv[1]; text = lambda name: pathlib.Path(name).read_text(encoding='utf-8'); versions = {'pyproject.toml': tomllib.loads(text('pyproject.toml'))['project']['version'], 'distribution.yaml': next(line.split(':', 1)[1].strip().strip(chr(34) + chr(39)) for line in text('distribution.yaml').splitlines() if line.startswith('version:'))}; bad = [f'the {name} version {v}' for name, v in versions.items() if v != tag]; sys.exit(f'tag v{tag} does not match ' + ' and '.join(bad) if bad else 0)" "${GITHUB_REF_NAME#v}"
      - name: Install the package and run the tests
        run: python -m pip install -e ".[mcp]" && make test PROFILE="$RUNNER_TEMP/h"
      - name: Build the wheel and sdist
        run: |
          python -m pip install build==1.6.1
          python -m build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/
      - name: Upload to PyPI by trusted publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
